<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión - MiFarmacia</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <div class="login-card">
      <div class="login-brand"><img src="assets/branding/logo-transparent.png" alt="Farmacias Gaital" class="login-brand-logo"></div>
      <p class="login-subtitle">Accede a tu panel de administración</p>

      <form id="login-form" class="login-form">
        <label>
          Usuario
          <input type="text" id="login-usuario" placeholder="Usuario" required />
        </label>
        <label>
          Contraseña
          <input type="password" id="login-password" placeholder="Contraseña" required />
        </label>
        <button type="submit" class="btn login-btn">Iniciar sesión</button>
      </form>

      <div class="login-hint">Usa tu usuario y contraseña registrados.</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
