<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f6ff"/>
      <stop offset="100%" stop-color="#e8f0ff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b4aa2"/>
      <stop offset="100%" stop-color="#3fa2ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <g opacity="0.2">
    <rect x="0" y="0" width="1200" height="520" fill="none" stroke="#0b4aa2" stroke-width="1" stroke-dasharray="4 10"/>
  </g>
  <g>
    <text x="70" y="150" font-size="54" font-family="Arial, sans-serif" font-weight="700" fill="#0b4aa2">Salud para toda la familia</text>
    <text x="70" y="200" font-size="24" font-family="Arial, sans-serif" fill="#1f2937">Ofertas especiales en vitaminas y cuidado diario</text>
  </g>
  <g>
    <rect x="70" y="240" rx="18" ry="18" width="260" height="56" fill="url(#pill)"/>
    <text x="95" y="277" font-size="22" font-family="Arial, sans-serif" fill="#ffffff">Ver promociones</text>
  </g>
  <g>
    <circle cx="970" cy="250" r="120" fill="#ffffff" stroke="#0b4aa2" stroke-width="6"/>
    <text x="930" y="260" font-size="48" font-family="Arial, sans-serif" font-weight="700" fill="#0b4aa2">20%</text>
    <text x="915" y="295" font-size="18" font-family="Arial, sans-serif" fill="#0b4aa2">de descuento</text>
  </g>
</svg>
